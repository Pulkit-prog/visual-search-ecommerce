version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: visual_search_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/catalog_images:/app/backend/catalog_images
      - ./backend/app/storage:/app/backend/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: visual_search_frontend
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      - backend